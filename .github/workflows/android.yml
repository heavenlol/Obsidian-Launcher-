name: Android CI

on:
  push:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: Rename and Restyle Launcher to Obsidian Launcher
        run: |
          find . -name "strings.xml" -exec sed -i 's/MojoLauncher/Obsidian Launcher/g' {} +
          find . -name "strings.xml" -exec sed -i 's/PojavLauncher/Obsidian Launcher/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:label="MojoLauncher"/android:label="Obsidian Launcher"/g' {} +
          find . -name "AndroidManifest.xml" -exec sed -i 's/android:label="PojavLauncher"/android:label="Obsidian Launcher"/g' {} +
          sed -i 's/#91dffb/#D32F2F/gI' app_pojavlauncher/src/main/res/values/colors.xml
          sed -i 's/#464646/#2A0000/gI' app_pojavlauncher/src/main/res/values/colors.xml

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Create out directory
        run: mkdir out

      - name: Build Debug .apk
        run: |
          gradle :app_pojavlauncher:assembleFullDebug
          mv app_pojavlauncher/build/outputs/apk/full/debug/app_pojavlauncher-full-debug.apk out/ObsidianLauncher-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ObsidianLauncher-debug
          path: out/ObsidianLauncher-debug.apk
